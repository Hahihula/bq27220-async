name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features defmt -- -D warnings
      - run: cargo build --target thumbv7em-none-eabi
      - run: cargo test
      - run: cargo test --features defmt
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: riscv32imac-unknown-none-elf,thumbv7em-none-eabi
      - run: cargo build --target riscv32imac-unknown-none-elf
      - run: cargo build --target riscv32imac-unknown-none-elf --features defmt
      - run: cargo build --target thumbv7em-none-eabi --features defmt
